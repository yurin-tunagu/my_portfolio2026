<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスク管理アプリ体験版｜つなぐスタジオ</title>
<style>
  :root{
    --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --line:#3a3a3c;
    --fg:#fff; --fg2:#9a9a9f; --fg3:#6b6b70;
    --q1:#ff5a5f; --q2:#f5a623; --q3:#4a7dff; --q4:#2ecc9b; --q0:#8e8e93;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  body{padding-bottom:80px}
  .exhibit-note{margin:0 18px 8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    color:var(--fg2);font-size:12px;line-height:1.55}
  .exhibit-note strong{color:var(--fg)}
  .backlink{color:#82b8ff;font-size:12px;text-decoration:none}
  .backlink:hover{text-decoration:underline}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 10px}
  h1{font-size:22px;font-weight:600;margin:0}
  .tabs{display:flex;gap:6px;padding:0 18px 14px}
  .tab{flex:1;padding:9px 0;text-align:center;border-radius:9px;background:var(--card);
    color:var(--fg2);font:inherit;font-size:14px;cursor:pointer;border:1px solid transparent;user-select:none}
  .tab.on{background:var(--card2);color:var(--fg);border-color:var(--line)}
  .btn{background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:9px;
    padding:8px 13px;font-size:13px;cursor:pointer;font-family:inherit}
  .btn:hover{background:#3a3a3c}
  .btn.pri{background:#0a84ff;border-color:#0a84ff}
  .btn.pri:hover{background:#3a9bff}
  .btn.danger{color:#ff6b6b}

  /* 受信箱 */
  #inboxView{padding:0 18px}
  .listcard{background:var(--card);border-radius:14px;padding:6px 0;margin-bottom:14px}
  .row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;cursor:pointer}
  .row:hover{background:#242426}
  .row+.row{border-top:1px solid #2a2a2c}
  .chk{flex:0 0 20px;height:20px;margin-top:1px;border-radius:5px;border:2px solid var(--q0);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#000}
  .chk.on{background:var(--q0);border-color:var(--q0)}
  .rowbody{flex:1;min-width:0}
  .rowtext{font-size:15px;line-height:1.45;word-break:break-word}
  .meta{margin-top:5px;font-size:12px;color:var(--fg3);display:flex;gap:10px;flex-wrap:wrap}
  .done .rowtext{color:var(--fg3);text-decoration:line-through}
  .sec{font-size:12px;color:var(--fg3);padding:14px 4px 8px;letter-spacing:.04em}

  /* マトリクス：常に2×2の十字。画面が狭くても崩さない */
  #matrixView{padding:0 14px}
  #quadGrid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:12px;align-items:stretch}
  .quad{background:var(--card);border-radius:14px;padding:14px 12px;min-height:210px;
    border:1.5px solid transparent;transition:border-color .12s}

  /* 十字の下の未分類レーン：2列ぶんの幅をまるごと使う */
  .lane{margin-top:12px;background:var(--card);border-radius:14px;padding:12px;
    border:1.5px solid transparent;transition:border-color .12s}
  .lane.over{border-color:#0a84ff;background:#1f2430}
  .lanehead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .lanetitle{font-size:13px;font-weight:600;color:var(--fg2)}
  .lanebody{max-height:190px;overflow-y:auto}
  .lanebody .card{cursor:grab}
  .quad.over{border-color:#0a84ff;background:#1f2430}
  .qhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .qdot{width:19px;height:19px;border-radius:50%;flex:0 0 19px;display:flex;align-items:center;
    justify-content:center;font-size:10px;font-weight:700;color:#000}
  .qname{font-size:13px;font-weight:600}
  .card{background:var(--card2);border-radius:9px;padding:10px 11px;margin-bottom:8px;
    font-size:13px;line-height:1.4;cursor:grab;border-left:3px solid var(--q0);word-break:break-word}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.35}
  .cardtop{display:flex;align-items:flex-start;gap:8px}
  .cardtext{flex:1;min-width:0}
  .cardchk{flex:0 0 18px;width:18px;height:18px;padding:0;border-radius:5px;
    border:2px solid var(--q0);background:transparent;color:#000;font-size:12px;line-height:1;
    cursor:pointer;font-family:inherit}
  .cardchk.on{background:var(--q0);border-color:var(--q0)}
  .card .cmeta{margin-top:5px;font-size:11px;color:var(--fg3)}
  .card.done{opacity:.4;text-decoration:line-through}
  .empty{color:var(--fg3);font-size:12px;padding:6px 2px}

  /* モーダル */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;
    justify-content:center;padding:18px;z-index:50}
  .mask.on{display:flex}
  .modal{background:#161618;border:1px solid var(--line);border-radius:16px;width:100%;
    max-width:620px;max-height:88vh;overflow:auto;padding:20px}
  .modal h2{font-size:17px;margin:0 0 14px;font-weight:600}
  label{display:block;font-size:12px;color:var(--fg2);margin:14px 0 6px}
  textarea,input[type=text],input[type=date],input[type=time],select{
    width:100%;background:var(--card);color:var(--fg);border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit}
  textarea{min-height:150px;resize:vertical;line-height:1.6}
  .acts{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  .prev{background:var(--card);border-radius:10px;padding:6px 0;margin-top:8px}
  .prevrow{display:flex;gap:10px;padding:9px 12px;font-size:13px;line-height:1.4;align-items:flex-start}
  .prevrow+.prevrow{border-top:1px solid #2a2a2c}
  .prevrow input{flex:0 0 auto;margin-top:3px}
  .qpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .qopt{padding:10px;border-radius:9px;background:var(--card);border:1.5px solid var(--line);
    font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .qopt.on{border-color:#fff}
  .note{font-size:12px;color:var(--fg3);line-height:1.6;margin-top:10px}

  .fab{position:fixed;right:20px;bottom:22px;width:58px;height:58px;border-radius:50%;
    background:#0a84ff;color:#fff;font-size:30px;border:none;cursor:pointer;z-index:20;
    display:flex;align-items:center;justify-content:center;line-height:1}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,12,.94);
    border-top:1px solid var(--line);padding:11px 18px;display:flex;gap:9px;
    align-items:center;backdrop-filter:blur(8px)}
  .spacer{flex:1}
  .tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--card2);color:var(--fg2)}
  .due{color:#5aa9ff}
  .due.over{color:#ff6b6b}
  .toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
    width:min(520px,calc(100% - 32px));background:#163554;color:#fff;border:1px solid #3387d6;
    border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;z-index:60}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 仕分けモード */
  .sortNum{font-size:12px;color:var(--fg3);margin-bottom:12px}
  .sortText{font-size:19px;line-height:1.5;padding:22px 18px;background:var(--card);
    border-radius:12px;min-height:96px;display:flex;align-items:center;word-break:break-word}
  .sortBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
  .sortBtn{padding:15px 12px;border-radius:11px;background:var(--card);border:1.5px solid var(--line);
    font-size:13px;cursor:pointer;display:flex;align-items:center;gap:9px;text-align:left;
    color:var(--fg);font-family:inherit}
  .sortBtn:hover{background:var(--card2)}
  .sortDone{text-align:center;padding:34px 10px;font-size:16px;color:var(--fg2)}

  /* 狭い画面でも2×2は維持したまま、中身だけ詰める */
  @media(max-width:640px){
    #matrixView{padding:0 10px}
    #quadGrid{gap:9px}
    .lane{margin-top:9px;padding:10px;border-radius:12px}
    .lanebody{max-height:150px}
    .sortText{font-size:17px;padding:18px 14px}
    .quad{padding:11px 9px;min-height:180px;border-radius:12px}
    .qhead{gap:6px;margin-bottom:9px}
    .qdot{width:17px;height:17px;flex:0 0 17px;font-size:9px}
    .qname{font-size:11.5px;line-height:1.25}
    .card{font-size:12px;padding:8px 9px;margin-bottom:6px;border-radius:8px}
    .card .cmeta{font-size:10px}
    .empty{font-size:11px}
  }
</style>
</head>
<body>

<header>
  <div><h1>タスク管理</h1><a class="backlink" href="../../work/">← 実績と制作へ戻る</a></div>
  <button class="btn" onclick="startDemo()">サンプル日報を取り込む</button>
</header>

<p class="exhibit-note"><strong>展示用デモ</strong>｜サンプル日報から翌日のタスクを取り込み、4つのマトリクスへ仕分けます。入力内容はこの画面内だけで扱われ、保存・送信されません。</p>

<div class="tabs">
  <button class="tab" id="tabInbox" type="button" onclick="setView('inbox')">受信箱</button>
  <button class="tab on" id="tabMatrix" type="button" onclick="setView('matrix')">マトリクス</button>
</div>

<div id="inboxView" style="display:none"></div>

<div id="matrixView">
  <div id="quadGrid"></div>
  <div class="lane" id="lane" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,null)">
    <div class="lanehead">
      <span class="lanetitle">未分類 <span id="unQty"></span></span>
      <span class="spacer"></span>
      <button class="btn pri" id="sortBtn" onclick="startSort()">仕分けモード</button>
    </div>
    <div class="lanebody" id="laneBody"></div>
  </div>
</div>

<button class="fab" onclick="openEdit(null)">+</button>

<div class="bar">
  <span class="tag" id="stat"></span>
  <span class="spacer"></span>
  <button class="btn" id="doneToggle" onclick="toggleCompleted()">完了を隠す</button>
  <button class="btn" onclick="startDemo()">サンプルを入れる</button>
  <button class="btn danger" onclick="clearAll()">空にする</button>
</div>

<div class="toast" id="toast" role="status"></div>

<!-- 取り込みモーダル -->
<div class="mask" id="importMask">
  <div class="modal">
    <h2>翌日の仕事を受信箱へ取り込む</h2>
    <p class="note">体験版として、文章をタスクごとに分けて受信箱へ追加できます。入力内容は保存されません。</p>
    <label>試したい文章を入力</label>
    <textarea id="importText" placeholder="例：予約一覧を確認する。お客様への返信を下書きする。今週の投稿テーマを考える。"></textarea>
    <label>メモ（任意）</label>
    <input type="text" id="importSrc" placeholder="例：明日の仕事">
    <div class="acts">
      <button class="btn" onclick="closeMask('importMask')">やめる</button>
      <button class="btn pri" onclick="doSplit()">分解する</button>
    </div>
    <div id="prevWrap" style="display:none">
      <label>この内容で受信箱に入れます（不要なものはチェックを外す／文言はその場で直せます）</label>
      <div class="prev" id="prevList"></div>
      <div class="acts">
        <button class="btn pri" onclick="commitImport()">受信箱に追加</button>
      </div>
    </div>
  </div>
</div>

<!-- 仕分けモード -->
<div class="mask" id="sortMask">
  <div class="modal">
    <h2>仕分けモード</h2>
    <div id="sortInner"></div>
  </div>
</div>

<!-- 編集モーダル -->
<div class="mask" id="editMask">
  <div class="modal">
    <h2 id="editTitle">タスク</h2>
    <label>内容</label>
    <textarea id="edText" style="min-height:80px"></textarea>
    <label>象限</label>
    <div class="qpick" id="qpick"></div>
    <label>期日（決まっていれば）</label>
    <input type="date" id="edDate">
    <label>時刻（決まっていれば）</label>
    <input type="time" id="edTime">
    <div class="note">体験版では期日・時刻がカードに表示されます。入力内容は保存されません。</div>
    <div class="acts">
      <button class="btn danger" onclick="delTask()">削除</button>
      <span class="spacer"></span>
      <button class="btn" onclick="closeMask('editMask')">やめる</button>
      <button class="btn pri" onclick="saveTask()">保存</button>
    </div>
  </div>
</div>

<script>
/* 入力した文章を、句点や改行ごとに受信箱のタスクへ分ける展示用の処理です。 */
const HEADINGS = /^(翌日への引き継ぎ|翌日引き継ぎ|引き継ぎ|明日やること|やること|やったこと|気づき|TODO|ToDo|メモ)$/i;

function splitIntoTasks(raw){
  if(!raw) return [];
  return raw
    .replace(/。/g, '。\n')                          // 「。」の直後で改行を入れる
    .split(/\r?\n/)                                  // 改行で切る
    .map(s => s
      .replace(/^\s*[-・*●○▪️🔜\d]+[.)．、]?\s*/,'') // 行頭の記号・番号を落とす
      .replace(/^\s*🔜\s*/,'')
      .replace(/[。\s]+$/,'')                        // 末尾の句点と空白を落とす
      .trim())
    .filter(s => s.length >= 3)                      // 短すぎる断片は捨てる
    .filter(s => !HEADINGS.test(s));                 // 「翌日への引き継ぎ」等の見出し行は捨てる
}

const QUADS = [
  {n:1, name:'緊急かつ重要',            c:'var(--q1)', r:'I'},
  {n:2, name:'重要だが緊急性がない',    c:'var(--q2)', r:'II'},
  {n:3, name:'重要ではないが緊急なもの',c:'var(--q3)', r:'III'},
  {n:4, name:'重要でも緊急でもない',    c:'var(--q4)', r:'IV'}
];
const qColor = q => q ? QUADS[q-1].c : 'var(--q0)';

let tasks = [], view = 'inbox', editingId = null, pending = [], showCompleted = true;

/* 展示用デモでは、データは画面を閉じると消えます。 */
function save(){ /* ステップ4で実装 */ }
function load(){ /* ステップ4で実装 */ }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function dueLabel(t){
  if(!t.due) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(t.due + 'T00:00:00');
  const diff = Math.round((d - today) / 86400000);
  let s = t.due.slice(5).replace('-','/');
  if(t.time) s += ' ' + t.time;
  if(diff < 0) s += '（' + (-diff) + '日超過）';
  else if(diff === 0) s = '今日 ' + (t.time || '');
  return '<span class="due' + (diff < 0 ? ' over' : '') + '">' + esc(s) + '</span>';
}
function ageLabel(t){
  if(t.done || !t.created) return '';
  const d = Math.floor((Date.now() - t.created) / 86400000);
  return d >= 3 ? '<span style="color:#c98b3a">' + d + '日放置</span>' : '';
}

/* --- 描画 --- */
function render(){
  const undone = tasks.filter(t => !t.done), done = tasks.filter(t => t.done);
  document.getElementById('stat').textContent =
    '未完了 ' + undone.length + ' 件 ／ 未分類 ' + undone.filter(t => !t.q).length + ' 件';
  document.getElementById('doneToggle').textContent = showCompleted ? '完了を隠す' : '完了を表示';

  // 受信箱
  const iv = document.getElementById('inboxView');
  if(!tasks.length){
    iv.innerHTML = '<div class="sec">タスクがありません。「サンプル日報を取り込む」を押して、受信箱への追加を試してみてください。</div>';
  } else {
    let h = '';
    if(undone.length){
      h += '<div class="listcard">' + undone.map(rowHTML).join('') + '</div>';
    }
    if(showCompleted && done.length){
      h += '<div class="sec">完了（' + done.length + '）</div>';
      h += '<div class="listcard">' + done.map(rowHTML).join('') + '</div>';
    }
    iv.innerHTML = h;
  }

  // マトリクス（十字）
  document.getElementById('quadGrid').innerHTML = QUADS.map(q => {
    const list = tasks.filter(t => t.q === q.n && (showCompleted || !t.done));
    const body = list.length
      ? list.map(cardHTML).join('')
      : '<div class="empty">未分類からドラッグ、または仕分けモードで入れます</div>';
    return '<div class="quad" data-q="' + q.n + '" ondragover="dragOver(event)" ' +
           'ondragleave="dragLeave(event)" ondrop="drop(event,' + q.n + ')">' +
           '<div class="qhead"><div class="qdot" style="background:' + q.c + '">' + q.r + '</div>' +
           '<div class="qname" style="color:' + q.c + '">' + q.name + '</div></div>' + body + '</div>';
  }).join('');

  // 十字の下の未分類レーン
  const un = undone.filter(t => !t.q);
  document.getElementById('unQty').textContent = un.length ? un.length + '件' : '';
  document.getElementById('sortBtn').style.display = un.length ? '' : 'none';
  document.getElementById('laneBody').innerHTML = un.length
    ? un.map(cardHTML).join('')
    : '<div class="empty">未分類はありません。日報を取り込むとここに並びます。</div>';
}

function rowHTML(t){
  return '<div class="row' + (t.done ? ' done' : '') + '" onclick="openEdit(\'' + t.id + '\')">' +
    '<div class="chk' + (t.done ? ' on' : '') + '" style="border-color:' + qColor(t.q) +
      (t.done ? ';background:' + qColor(t.q) : '') + '" onclick="event.stopPropagation();toggle(\'' + t.id + '\')">' +
      (t.done ? '✓' : '') + '</div>' +
    '<div class="rowbody"><div class="rowtext">' + esc(t.text) + '</div>' +
    '<div class="meta">' +
      (t.q ? '<span style="color:' + qColor(t.q) + '">' + QUADS[t.q-1].r + '</span>' : '<span>未分類</span>') +
      (t.src ? '<span>' + esc(t.src) + 'の日報</span>' : '') +
      dueLabel(t) + ageLabel(t) +
    '</div></div></div>';
}

function cardHTML(t){
  return '<div class="card' + (t.done ? ' done' : '') + '" draggable="true" data-id="' + t.id + '" ' +
    'style="border-left-color:' + qColor(t.q) + '" ondragstart="dragStart(event)" ondragend="dragEnd(event)" ' +
    'onclick="openEdit(\'' + t.id + '\')"><div class="cardtop"><div class="cardtext">' + esc(t.text) + '</div>' +
    '<button class="cardchk' + (t.done ? ' on' : '') + '" aria-label="' + (t.done ? '未完了に戻す' : '完了にする') + '" ' +
    'onclick="event.stopPropagation();toggle(\'' + t.id + '\')">' + (t.done ? '✓' : '') + '</button></div>' +
    (t.due || t.src ? '<div class="cmeta">' + (t.src ? esc(t.src) + ' ' : '') + dueLabel(t) + '</div>' : '') +
    '</div>';
}

/* --- 操作 --- */
function setView(v){
  view = v;
  document.getElementById('inboxView').style.display  = v === 'inbox'  ? '' : 'none';
  document.getElementById('matrixView').style.display = v === 'matrix' ? 'block' : 'none';
  document.getElementById('tabInbox').classList.toggle('on', v === 'inbox');
  document.getElementById('tabMatrix').classList.toggle('on', v === 'matrix');
}
function toggleCompleted(){
  showCompleted = !showCompleted;
  render();
}
function toggle(id){
  const t = tasks.find(x => x.id === id); if(!t) return;
  t.done = !t.done; save(); render();
}

let dragId = null;
function dragStart(e){ dragId = e.target.dataset.id; e.target.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function dragEnd(e){
  e.target.classList.remove('dragging');
  document.querySelectorAll('.quad,.lane').forEach(q => q.classList.remove('over'));
}
function dragOver(e){ e.preventDefault(); e.currentTarget.classList.add('over'); }
function dragLeave(e){ e.currentTarget.classList.remove('over'); }
function drop(e,q){
  e.preventDefault(); e.currentTarget.classList.remove('over');
  const t = tasks.find(x => x.id === dragId);
  if(t){ t.q = q; save(); render(); }   // q が null なら未分類レーンへ戻る
}

/* --- 仕分けモード：未分類を1枚ずつ大きく出して4つのボタンで振り分ける --- */
let sortQueue = [], sortIdx = 0, sortCount = 0;

function startSort(){
  sortQueue = tasks.filter(t => !t.done && !t.q).map(t => t.id);
  sortIdx = 0; sortCount = 0;
  if(!sortQueue.length){ alert('未分類のタスクはありません'); return; }
  document.getElementById('sortMask').classList.add('on');
  drawSort();
}

function drawSort(){
  const box = document.getElementById('sortInner');
  if(sortIdx >= sortQueue.length){
    box.innerHTML = '<div class="sortDone">仕分け完了。' + sortCount + ' 件を振り分けました。</div>' +
      '<div class="acts"><button class="btn pri" onclick="endSort()">閉じる</button></div>';
    return;
  }
  const t = tasks.find(x => x.id === sortQueue[sortIdx]);
  if(!t){ sortIdx++; drawSort(); return; }   // 途中で消えていたら飛ばす
  box.innerHTML =
    '<div class="sortNum">' + (sortIdx + 1) + ' / ' + sortQueue.length +
      (t.src ? '　（' + esc(t.src) + 'の日報）' : '') + '</div>' +
    '<div class="sortText">' + esc(t.text) + '</div>' +
    '<div class="sortBtns">' + QUADS.map(q =>
      '<button class="sortBtn" onclick="sortInto(' + q.n + ')">' +
      '<span class="qdot" style="background:' + q.c + '">' + q.r + '</span>' + q.name + '</button>').join('') +
    '</div>' +
    '<div class="acts">' +
      '<button class="btn" onclick="sortSkip()">この1件はあとで</button>' +
      '<span class="spacer"></span>' +
      '<button class="btn" onclick="endSort()">中断する</button>' +
    '</div>';
}

function sortInto(q){
  const t = tasks.find(x => x.id === sortQueue[sortIdx]);
  if(t){ t.q = q; sortCount++; save(); }
  sortIdx++; drawSort();
}
function sortSkip(){ sortIdx++; drawSort(); }
function endSort(){ closeMask('sortMask'); render(); }

/* --- 編集 --- */
function openEdit(id){
  editingId = id;
  const t = id ? tasks.find(x => x.id === id) : null;
  pickedQ = t ? t.q : null;
  document.getElementById('editTitle').textContent = t ? 'タスクを編集' : 'タスクを追加';
  document.getElementById('edText').value = t ? t.text : '';
  document.getElementById('edDate').value = t && t.due  ? t.due  : '';
  document.getElementById('edTime').value = t && t.time ? t.time : '';
  renderQpick(pickedQ);
  document.getElementById('editMask').classList.add('on');
}
function renderQpick(cur){
  document.getElementById('qpick').innerHTML =
    ('<div class="qopt' + (!cur ? ' on' : '') + '" data-q="0" onclick="pickQ(0)">' +
     '<span class="qdot" style="background:var(--q0)"></span>受信箱のまま</div>') +
    QUADS.map(q => '<div class="qopt' + (cur === q.n ? ' on' : '') + '" data-q="' + q.n + '" onclick="pickQ(' + q.n + ')">' +
      '<span class="qdot" style="background:' + q.c + '">' + q.r + '</span>' + q.name + '</div>').join('');
}
let pickedQ = null;
function pickQ(n){ pickedQ = n || null; renderQpick(pickedQ); }
function saveTask(){
  const text = document.getElementById('edText').value.trim();
  if(!text){ alert('内容を入れてください'); return; }
  const due  = document.getElementById('edDate').value || null;
  const time = document.getElementById('edTime').value || null;
  if(editingId){
    const t = tasks.find(x => x.id === editingId);
    Object.assign(t, {text, q:pickedQ, due, time});
  } else {
    tasks.unshift({id:uid(), text, q:pickedQ, due, time, done:false, created:Date.now(), src:''});
  }
  closeMask('editMask'); save(); render();
}
function delTask(){
  if(!editingId){ closeMask('editMask'); return; }
  if(!confirm('このタスクを削除しますか？')) return;
  tasks = tasks.filter(x => x.id !== editingId);
  closeMask('editMask'); save(); render();
}

/* --- 取り込み --- */
function openImport(){
  document.getElementById('importText').value = '';
  document.getElementById('importSrc').value  = '';
  document.getElementById('prevWrap').style.display = 'none';
  document.getElementById('importMask').classList.add('on');
}
function doSplit(){
  const raw = document.getElementById('importText').value;
  pending = splitIntoTasks(raw);
  if(!pending.length){ alert('分解できる文が見つかりませんでした'); return; }
  document.getElementById('prevList').innerHTML = pending.map((s,i) =>
    '<div class="prevrow"><input type="checkbox" checked id="pv' + i + '">' +
    '<input type="text" value="' + esc(s) + '" id="pt' + i + '" style="flex:1"></div>').join('');
  document.getElementById('prevWrap').style.display = '';
}
function commitImport(){
  const src = document.getElementById('importSrc').value.trim();
  let n = 0;
  pending.forEach((_, i) => {
    if(!document.getElementById('pv' + i).checked) return;
    const text = document.getElementById('pt' + i).value.trim();
    if(!text) return;
    tasks.unshift({id:uid(), text, q:null, due:null, time:null, done:false, created:Date.now(), src});
    n++;
  });
  closeMask('importMask'); save(); render(); setView('matrix');
  alert(n + ' 件を未分類レーンに入れました。十字へドラッグするか、「仕分けモード」で一気に振り分けられます。');
}

function closeMask(id){ document.getElementById(id).classList.remove('on'); }
document.querySelectorAll('.mask').forEach(m =>
  m.addEventListener('click', e => { if(e.target === m) m.classList.remove('on'); }));

let toastTimer = null;
function showToast(message){
  const el = document.getElementById('toast');
  el.textContent = message;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 5200);
}

function clearAll(){
  if(!confirm('表示中のタスクを空にします。よろしいですか？')) return;
  tasks = []; save(); render();
}
